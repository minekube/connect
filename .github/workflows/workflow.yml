name: workflow
on:
  push:
  pull_request:
    types: [ opened, reopened, synchronize ]
permissions:
  contents: read
  # Optional: allow read access to pull request. Use with `only-new-issues` option.
  # pull-requests: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go with cache
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout 3m0s

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go with cache
        uses: actions/setup-go@v6
        with:
          cache: true
          go-version-file: go.mod

      - name: Test
        run: make test

  # The generated proto revision this library compiles against is decided by
  # the CONSUMER's build list (MVS), not by go.mod's minimum: moxy already
  # pins a revision that carries the watch payload in a `payload` oneof
  # instead of plain optional fields. Test the newest published generation so
  # the library can never start depending on one Go shape again - that class
  # of breakage only surfaced months later, in a consumer's Renovate PR.
  proto-compat:
    name: proto-compat (newest generated revision)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          cache: true
          go-version: stable

      - name: Test against the newest generated proto revision
        env:
          PROTO_MODULE: buf.build/gen/go/minekube/connect/protocolbuffers/go
        run: |
          set -euo pipefail
          newest="$(go list -m -versions "$PROTO_MODULE" | awk '{print $NF}')"
          echo "testing against $PROTO_MODULE@$newest"
          go get "$PROTO_MODULE@$newest"
          go test ./...

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .web
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install docs dependencies
        run: yarn install --immutable

      - name: Check docs content
        run: yarn check:docs

      - name: Check changelog in Chrome
        run: yarn check:changelog-layout
